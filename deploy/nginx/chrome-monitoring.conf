server {
    listen 80;
    listen [::]:80;

    # ⚠️ Remplacer par le domaine réel du serveur (et www. si besoin).
    # Pour tester rapidement via l'IP uniquement, mettre :  server_name _;
    server_name ton-domaine.com www.ton-domaine.com;

    # Front buildé par Vite
    root /opt/chrome-monitoring/code/frontend/dist;
    index index.html;

    # SPA React : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques générés par Vite (hash dans le nom) → cache long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API FastAPI (même origine → pas de CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
